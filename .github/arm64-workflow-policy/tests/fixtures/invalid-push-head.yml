name: Invalid push head

on:
  push:

jobs:
  check:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify synthetic head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: python .github/arm64-workflow-policy/verify_head.py "$env:EXPECTED_HEAD"
