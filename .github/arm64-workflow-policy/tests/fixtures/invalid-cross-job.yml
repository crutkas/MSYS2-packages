name: Invalid cross-job guards

on:
  push:

env:
  ARM64_CONSUMER_LOCK: .github/arm64-workflow-locks/valid-consumer-lock.json

jobs:
  checkout:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.after }}
          persist-credentials: false

      - name: Validate immutable consumer lock in the wrong job
        run: python .github/arm64-workflow-policy/validate.py evidence "$env:ARM64_CONSUMER_LOCK"

  consume:
    runs-on: windows-11-arm
    steps:
      - name: Verify canonical push head in the wrong job
        env:
          EXPECTED_HEAD: ${{ github.event.after }}
        run: python .github/arm64-workflow-policy/verify_head.py "$env:EXPECTED_HEAD"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 24680
          repository: crutkas/MSYS2-packages
          run-id: 123456789
          github-token: ${{ github.token }}
