name: msysarm64-zlib

on:
  push:
    branches:
      - crutkas-arm64-msys-zlib
  pull_request:
    branches:
      - crutkas-aarch64-gcc-layer
    paths:
      - .github/workflows/main.yml
      - .github/workflows/msysarm64-zlib.yml
      - .ci/check-aarch64-pseudo-relocs.ps1
      - mingw-w64-cross-msysarm64-zlib/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msysarm64-zlib-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: 1703203200

jobs:
  build:
    if: >-
      ${{
        github.repository == 'crutkas/MSYS2-packages' &&
        (github.ref_name == 'crutkas-arm64-msys-zlib' ||
         github.head_ref == 'crutkas-arm64-msys-zlib')
      }}
    runs-on: windows-2025

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update MSYS2 build environment
        shell: pwsh
        run: |
          $pacmanConf = 'C:\msys64\etc\pacman.conf'
          $contents = Get-Content $pacmanConf -Raw
          if ($contents -notmatch '^\[staging\]') {
            $contents = "[staging]`nServer = https://repo.msys2.org/staging/`nSigLevel = Never`n$contents"
            Set-Content $pacmanConf -Value $contents -NoNewline
          }
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suuy
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suu
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm --needed -S `
            base-devel gcc git gnupg python
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 update failed with exit code $LASTEXITCODE"
          }

      - name: Pin, redownload, and atomically install compiler inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'msysarm64-zlib-toolchain'
          & .\mingw-w64-cross-msysarm64-zlib\bootstrap-toolchain.ps1 `
            -Destination $destination `
            -MsysRoot 'C:\msys64' `
            -Install

      - name: Build and validate package split
        shell: pwsh
        run: |
          $workspace = & 'C:\msys64\usr\bin\cygpath.exe' -u $env:GITHUB_WORKSPACE
          $inputRoot = Join-Path `
            $env:RUNNER_TEMP `
            'msysarm64-zlib-toolchain\primary'
          $inputRoot = & 'C:\msys64\usr\bin\cygpath.exe' -u $inputRoot
          $script = @'
          set -euo pipefail
          export PATH=/usr/bin:/opt/bin:/mingw64/bin:$PATH
          mkdir -p "$HOME"
          cd "$1/mingw-w64-cross-msysarm64-zlib"
          dos2unix -q PKGBUILD README.md bootstrap-toolchain.ps1 canonicalize-packages.sh validate-zlib.sh validate-packages.sh ../.ci/check-aarch64-pseudo-relocs.ps1 *.patch
          bash -n PKGBUILD canonicalize-packages.sh validate-zlib.sh validate-packages.sh
          ../.ci/fetch-validpgpkeys.sh
          makepkg --noconfirm --noprogressbar --cleanbuild
          bash ./canonicalize-packages.sh ./*.pkg.tar.zst
          rm -rf ci-package-report
          ./validate-packages.sh . ci-package-report "$2"
          '@
          & 'C:\msys64\usr\bin\bash.exe' `
            --noprofile --norc -c $script -- $workspace $inputRoot
          if ($LASTEXITCODE -ne 0) {
            throw "zlib build or validation failed with exit code $LASTEXITCODE"
          }

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Path $output | Out-Null
          Copy-Item `
            (Join-Path $env:GITHUB_WORKSPACE 'mingw-w64-cross-msysarm64-zlib\*.pkg.tar.zst') `
            $output
          Copy-Item `
            (Join-Path $env:GITHUB_WORKSPACE 'mingw-w64-cross-msysarm64-zlib\ci-package-report\release-SHA256SUMS') `
            $output

      - name: Collect native pseudo-reloc smoke inputs
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-inputs'
          New-Item -ItemType Directory -Path $bundle | Out-Null
          $inputs = [ordered]@{
            'pseudo-reloc-cxx.exe' = Join-Path `
              $env:GITHUB_WORKSPACE `
              'mingw-w64-cross-msysarm64-zlib\src\zlib-report\pseudo-reloc-cxx.exe'
            'msys-gcc_s-seh-1.dll' = `
              'C:\msys64\opt\lib\gcc\aarch64-pc-msys\msys-gcc_s-seh-1.dll'
            'msys-stdc++-6.dll' = `
              'C:\msys64\opt\lib\gcc\aarch64-pc-msys\15.0.1\msys-stdc++-6.dll'
          }
          foreach ($entry in $inputs.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $entry.Value -PathType Leaf)) {
              throw "native smoke input is missing: $($entry.Value)"
            }
            Copy-Item `
              -LiteralPath $entry.Value `
              -Destination (Join-Path $bundle $entry.Key)
          }
          $manifest = @(
            Get-ChildItem -LiteralPath $bundle -File |
              Sort-Object Name |
              ForEach-Object {
                $hash = (
                  Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
                ).Hash.ToLowerInvariant()
                "$hash  $($_.Name)"
              }
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $bundle 'SHA256SUMS'),
            (($manifest -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload package release candidates
        uses: actions/upload-artifact@v4
        with:
          name: msysarm64-zlib-packages
          if-no-files-found: error
          retention-days: 14
          path: artifacts/*

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: msysarm64-zlib-validation
          if-no-files-found: error
          retention-days: 14
          path: |
            .ci/check-aarch64-pseudo-relocs.ps1
            mingw-w64-cross-msysarm64-zlib/src/zlib-report/*
            mingw-w64-cross-msysarm64-zlib/ci-package-report/*
            ${{ runner.temp }}/msysarm64-zlib-toolchain/*.tsv

      - name: Upload native pseudo-reloc smoke inputs
        uses: actions/upload-artifact@v4
        with:
          name: msysarm64-zlib-native-inputs
          if-no-files-found: error
          retention-days: 14
          path: native-smoke-inputs/*

  native-smoke:
    if: >-
      ${{
        github.repository == 'crutkas/MSYS2-packages' &&
        (github.ref_name == 'crutkas-arm64-msys-zlib' ||
         github.head_ref == 'crutkas-arm64-msys-zlib')
      }}
    needs: build
    runs-on: windows-11-arm

    steps:
      - name: Initialize native ARM64 MSYS2 tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: tar zstd

      - uses: actions/download-artifact@v4
        with:
          name: msysarm64-zlib-packages
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: msysarm64-zlib-native-inputs
          path: native-inputs

      - name: Download pinned native runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'native-runtime'
          New-Item -ItemType Directory -Path $runtime | Out-Null
          $name = 'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst'
          gh release download msysarm64-runtime-pr10-a527-20260824 `
            --repo crutkas/MSYS2-packages `
            --pattern $name `
            --dir $runtime
          $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $runtime $name)).Hash.ToLowerInvariant()
          $expected = '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'
          if ($actual -ne $expected) {
            throw "native runtime SHA-256 mismatch: $actual"
          }

      - name: Execute native ARM64 minigzip roundtrip
        shell: pwsh
        run: |
          $processor = Get-CimInstance -Class Win32_Processor | Select-Object -First 1
          if ($processor.Architecture -ne 12) {
            throw "native smoke requires ARM64 Windows; processor architecture is $($processor.Architecture)"
          }

          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          $bash = Join-Path $msysRoot 'usr\bin\bash.exe'
          $workspace = & (Join-Path $msysRoot 'usr\bin\cygpath.exe') -u $env:GITHUB_WORKSPACE
          $temp = & (Join-Path $msysRoot 'usr\bin\cygpath.exe') -u $env:RUNNER_TEMP
          $extractScript = @'
          set -euo pipefail
          export PATH=/usr/bin:/bin:$PATH
          packages="$1/packages"
          native_inputs="$1/native-inputs"
          temp="$2"
          stage="$temp/msysarm64-zlib-native-stage"
          root="$temp/msysarm64-zlib-native-root"
          rm -rf "$stage" "$root"
          mkdir -p "$stage" "$root/usr/bin"
          (
            cd "$packages"
            sha256sum -c release-SHA256SUMS
          )
          (
            cd "$native_inputs"
            sha256sum -c SHA256SUMS
          )
          MSYS=winsymlinks:sys bsdtar -xf \
            "$temp/native-runtime/mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" \
            -C "$stage"
          MSYS=winsymlinks:sys bsdtar -xf \
            "$packages/mingw-w64-cross-msysarm64-zlib-1.3.1-1-x86_64.pkg.tar.zst" \
            -C "$stage"
          MSYS=winsymlinks:sys bsdtar -xf \
            "$packages/mingw-w64-cross-msysarm64-zlib-minigzip-1.3.1-1-x86_64.pkg.tar.zst" \
            -C "$stage"
          cp "$stage/opt/aarch64-pc-msys/bin/msys-2.0.dll" "$root/usr/bin/"
          cp "$stage/opt/aarch64-pc-msys/usr/bin/msys-z.dll" "$root/usr/bin/"
          cp "$stage/opt/aarch64-pc-msys/usr/bin/minigzip.exe" "$root/usr/bin/"
          cp "$native_inputs/pseudo-reloc-cxx.exe" "$root/usr/bin/"
          cp "$native_inputs/msys-gcc_s-seh-1.dll" "$root/usr/bin/"
          cp "$native_inputs/msys-stdc++-6.dll" "$root/usr/bin/"
          '@
          & $bash --noprofile --norc -c $extractScript -- $workspace $temp
          if ($LASTEXITCODE -ne 0) {
            throw "native payload extraction failed with exit code $LASTEXITCODE"
          }

          $nativeRoot = Join-Path $env:RUNNER_TEMP 'msysarm64-zlib-native-root'
          $bin = Join-Path $nativeRoot 'usr\bin'
          function Assert-AA64([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
            if ($machine -ne 0xaa64) {
              throw "$Path is not AA64: 0x$($machine.ToString('x4'))"
            }
          }
          Assert-AA64 (Join-Path $bin 'msys-2.0.dll')
          Assert-AA64 (Join-Path $bin 'msys-z.dll')
          Assert-AA64 (Join-Path $bin 'minigzip.exe')
          Assert-AA64 (Join-Path $bin 'pseudo-reloc-cxx.exe')
          Assert-AA64 (Join-Path $bin 'msys-gcc_s-seh-1.dll')
          Assert-AA64 (Join-Path $bin 'msys-stdc++-6.dll')

          $input = Join-Path $nativeRoot 'roundtrip.txt'
          $compressed = "$input.gz"
          $output = "$input.out"
          [System.IO.File]::WriteAllText(
            $input,
            ("native ARM64 MSYS zlib roundtrip`n" * 256),
            [System.Text.UTF8Encoding]::new($false)
          )
          $env:MSYSTEM = 'MSYS'
          $env:MSYS2_PATH_TYPE = 'inherit'
          Push-Location $bin
          try {
            & $env:ComSpec /d /c "`"minigzip.exe`" < `"$input`" > `"$compressed`""
            if ($LASTEXITCODE -ne 0) {
              throw "native compression failed with exit code $LASTEXITCODE"
            }
            & $env:ComSpec /d /c "`"minigzip.exe`" -d < `"$compressed`" > `"$output`""
            if ($LASTEXITCODE -ne 0) {
              throw "native decompression failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          $inputHash = (Get-FileHash -Algorithm SHA256 $input).Hash.ToLowerInvariant()
          $outputHash = (Get-FileHash -Algorithm SHA256 $output).Hash.ToLowerInvariant()
          if ($inputHash -ne $outputHash) {
            throw "native roundtrip mismatch: input=$inputHash output=$outputHash"
          }

          $pseudoRelocOutput = @(
            & (Join-Path $bin 'pseudo-reloc-cxx.exe') 2>&1
          ) | ForEach-Object { $_.ToString() }
          $pseudoRelocOutput | Set-Content `
            (Join-Path $nativeRoot 'pseudo-reloc-cxx.stdout.txt') `
            -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) {
            throw "native C++ pseudo-reloc probe failed with exit code $LASTEXITCODE"
          }
          if ($pseudoRelocOutput -notcontains 'cxx-runtime-ok') {
            throw 'native C++ pseudo-reloc probe omitted cxx-runtime-ok'
          }

          @(
            "processor`t$($processor.Name)"
            "architecture`tARM64"
            "runtime`t3.6.10.r0.ga527ace21-1"
            "zlib`t1.3.1-1"
            "input-sha256`t$inputHash"
            "output-sha256`t$outputHash"
            "pseudo-reloc-cxx`tcxx-runtime-ok"
          ) | Set-Content `
            (Join-Path $nativeRoot 'native-smoke.tsv') `
            -Encoding utf8NoBOM

      - name: Upload native execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: msysarm64-zlib-native-smoke
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/msysarm64-zlib-native-root/native-smoke.tsv
            ${{ runner.temp }}/msysarm64-zlib-native-root/pseudo-reloc-cxx.stdout.txt
