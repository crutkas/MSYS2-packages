name: Native ARM64 ncurses admission

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - crutkas-native-arm64-ncurses
  pull_request:
    branches:
      - crutkas-native-arm64-ncurses
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.repository == 'crutkas/MSYS2-packages' }}
    strategy:
      fail-fast: false
      matrix:
        build: [1, 2]
    name: admission-build-${{ matrix.build }}
    runs-on: windows-2025
    env:
      CI_BASE_REPOSITORY: https://github.com/${{ github.repository }}.git
      CI_BASE_REF: ${{ github.event.pull_request.base.ref || (github.ref_name == 'crutkas-native-arm64-ncurses' && 'crutkas-congenial-system' || 'master') }}
      CI_PACKAGE_PREFIXES: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses')) && 'mingw-w64-cross-cygwinarm64- mingw-w64-cross-msysarm64-' || '' }}
      CI_RUN_CHECK: '1'
      CI_CANONICALIZE_PACKAGES: '1'
      SOURCE_DATE_EPOCH: 1786817435

    steps:
      - name: Gather Facts
        id: facts
        run : |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize -Wrap
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name
          $BUILD_DRIVE = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          echo "drive=$BUILD_DRIVE" >> $env:GITHUB_OUTPUT

      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          path: temp
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Add staging repo
        shell: pwsh
        run: |
          $pacmanConf = 'C:\msys64\etc\pacman.conf'
          $contents = Get-Content $pacmanConf -Raw
          if ($contents -notmatch '^\[staging\]') {
            $contents = "[staging]`nServer = https://repo.msys2.org/staging/`nSigLevel = Never`n$contents"
          }
          Set-Content $pacmanConf -Value $contents -NoNewline

      - name: Update using staging
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suuy
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suu
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm --needed -S git python base-devel

      - name: Download fork-local AArch64 Cygwin inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'cygwinarm64-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download cygwinarm64-binutils-pr21-3356eec-20260827 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-binutils-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-gcc-static-runtime-20260815 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-stage1-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-sysroot-pr3-20260813 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-headers-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-windows-default-manifest-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-sysroot-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-w32api-20260813 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-w32api-runtime-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-libstdcxx-headers-pr7-20260815 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-libstdc++-headers-*.pkg.tar.zst' `
            --dir $destination

          $expected = @{
            'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' = '3c7b47529181dab726d22cf6ed045184260af915eea583488c13c07e478ac02b'
            'mingw-w64-cross-cygwinarm64-headers-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = '5266346cc10b142f871704ce4277699b1a5daa3121dc869990b4bedce69c0611'
            'mingw-w64-cross-cygwinarm64-windows-default-manifest-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = 'cc089511fede6042a25f83fcb5903fddeede89ddd9655360741513ee9015e3dc'
            'mingw-w64-cross-cygwinarm64-sysroot-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = '4ed8a30f592317bf7e4def6f3c773139f2565b0f8afaedd820f7ee46d33cad20'
            'mingw-w64-cross-cygwinarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' = '53478f9a60e2fdad7d3b4357fa4fb937a1afab16af16a55e5a25ae9fac308fa7'
            'mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '063579211851ed69370a6362f2795e39d9be0235a2bfe2f58da1bbd73a1d108e'
            'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '17a8fbc22227c541ff3179179d307045302f6b18fbc6207cf9d863a9e4dad98c'
            'mingw-w64-cross-cygwinarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' = '1e018d384e5e16b76524b69677819b660e6611480a85a7f7b8a412403bf15ea6'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 Cygwin inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $input_dir = Join-Path $env:RUNNER_TEMP 'cygwinarm64-inputs'
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U `
            "$input_dir\mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-headers-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-windows-default-manifest-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-sysroot-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst"

      - name: Preflight fork-local AArch64 Cygwin inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $packages = @(
            'mingw-w64-cross-cygwinarm64-gcc-stage1',
            'mingw-w64-cross-cygwinarm64-gcc-libs-stage1',
            'mingw-w64-cross-cygwinarm64-binutils',
            'mingw-w64-cross-cygwinarm64-libstdc++-headers'
          )
          foreach ($pkg in $packages) {
            & 'C:\msys64\usr\bin\pacman.exe' -Q $pkg
          }
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $script = @'
          set -euo pipefail
          LIBRARY_PATH=/opt/lib/gcc/aarch64-pc-cygwin/15.0.1:/opt/aarch64-pc-msys/lib
          libgcc=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-cygwin-gcc -print-file-name=libgcc.a)
          libkernel32=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-cygwin-gcc -print-file-name=libkernel32.a)
          libntdll=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-cygwin-gcc -print-file-name=libntdll.a)
          for path in "$libgcc" "$libkernel32" "$libntdll"; do
            test -f "$path"
            aarch64-pc-cygwin-objdump -f "$path" | grep -F 'architecture: aarch64'
          done
          '@
          & $bash --login -lc $script

      - name: Download fork-local AArch64 MSYS runtime inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'msysarm64-runtime-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $release = 'msysarm64-runtime-pr10-a527-20260824'
          $packages = @(
            @('mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst', '263f8f7e3614ac41337ce3a223f2bb26b6459aef6f34670525cdd4c03ec3ae21'),
            @('mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst', '33861708e7f981b4eef5b93ef135ab3a43d2757533f64df6f61a146d823c355f'),
            @('mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst', 'e30609e09eab2fa07aba2e6196b05f34e5e9107abc4ab8832966684758c743ca'),
            @('mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst', '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'),
            @('mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst', 'c18b51e483991770b8e06cc2d8f7002d06784d3071ac213a8fee24bb831267d1')
          )
          foreach ($package in $packages) {
            $name = $package[0]
            $url = "https://github.com/crutkas/MSYS2-packages/releases/download/$release/$name"
            Invoke-WebRequest -Uri $url -OutFile (Join-Path $destination $name)
          }

          $expected = @{
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '263f8f7e3614ac41337ce3a223f2bb26b6459aef6f34670525cdd4c03ec3ae21'
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '33861708e7f981b4eef5b93ef135ab3a43d2757533f64df6f61a146d823c355f'
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'e30609e09eab2fa07aba2e6196b05f34e5e9107abc4ab8832966684758c743ca'
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'c18b51e483991770b8e06cc2d8f7002d06784d3071ac213a8fee24bb831267d1'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 MSYS runtime inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $input_dir = Join-Path $env:RUNNER_TEMP 'msysarm64-runtime-inputs'
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U `
            "$input_dir\mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst"

      - name: Download fork-local AArch64 MSYS compiler inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'msysarm64-gcc-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $gccLibsUrl = 'https://github.com/crutkas/MSYS2-packages/releases/download/msysarm64-gcc-pr13-20260826/mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst'
          $gccUrl = 'https://github.com/crutkas/MSYS2-packages/releases/download/msysarm64-gcc-pr13-20260826/mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst'
          Invoke-WebRequest -Uri $gccLibsUrl -OutFile (Join-Path $destination 'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst')
          Invoke-WebRequest -Uri $gccUrl -OutFile (Join-Path $destination 'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst')

          $expected = @{
            'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' = '990f163cacf9ffce1b58445be91fedc57f135cc26a88d7dba109806446b41438'
            'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' = 'a74887c76a933ec424933bf662729d94975b83138af783bd93f2e7acd95c3a22'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 MSYS compiler inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $env:MSYS = 'winsymlinks:sys'
          $input_dir = Join-Path $env:RUNNER_TEMP 'msysarm64-gcc-inputs'
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U `
            "$input_dir\mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst"

      - name: Add MSYS tool aliases
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $binDir = 'C:\msys64\opt\bin'
          $tools = @('as', 'ld', 'ar', 'nm', 'objcopy', 'objdump', 'ranlib', 'strip', 'windres', 'dlltool', 'readelf', 'size', 'addr2line', 'strings')
          foreach ($tool in $tools) {
            $source = Join-Path $binDir "aarch64-pc-cygwin-$tool.exe"
            $dest = Join-Path $binDir "aarch64-pc-msys-$tool.exe"
            if ((Test-Path $source) -and -not (Test-Path $dest)) {
              Copy-Item $source $dest
            }
          }

      - name: Move Checkout
        run: |
          $path = "${{ steps.facts.outputs.drive }}\_"
          If (Test-Path "$path") { rm -r -fo "$path" }
          Move-Item -Path ".\temp" -Destination "$path"

      - name: Assert ncurses patch byte hashes
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $buildRoot = '${{ steps.facts.outputs.drive }}\_'
          $expected = @{
            'mingw-w64-cross-msysarm64-ncurses\ncurses-6.6-msys-winconpty.patch' = 'c35506845aeda302350a527e5f695968e10a9134bc2dbb5c98e59a800f06afad'
            'mingw-w64-cross-msysarm64-ncurses\ncurses-6.6-msys-sleep-windows.patch' = '0688890a50b114e7a1ad9418dd68f7b3e5eaa7fc201d9c5f1ff8c644b8d65d76'
            'mingw-w64-cross-msysarm64-ncurses\ncurses-6.6-msys-mkdir-mode.patch' = '0b616e41db0edd0a778a0d3acccee4f2201ca72d86552b7a2320f3fd7f921c96'
            'mingw-w64-cross-msysarm64-ncurses\ncurses-6.6-msys-widechars.patch' = 'a68a6c23d4ad87f4159bb98bd2aa21b18edc9ee6e7246cb443fd24145fe72365'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $buildRoot $entry.Key
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "SHA-256 mismatch for $($entry.Key): expected $($entry.Value) got $actual"
            }
          }

      - name: Seed MSYS w32api runtime dependency
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-native-arm64-ncurses' || github.head_ref == 'crutkas-native-arm64-ncurses') }}
        shell: pwsh
        run: |
          $env:MSYS2_PATH_TYPE = 'inherit'
          $env:PATH = 'C:\msys64\usr\bin;C:\msys64\mingw64\bin;' + $env:PATH
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $buildRoot = '${{ steps.facts.outputs.drive }}\_'
          $buildRoot = & 'C:\msys64\usr\bin\cygpath.exe' -u $buildRoot
          $script = @'
          set -euo pipefail
          cd '__BUILDROOT__/mingw-w64-cross-msysarm64-w32api-runtime'
          makepkg --noconfirm --noprogressbar --syncdeps --cleanbuild --nocheck
          package=( *.pkg.tar.* )
          pacman --noconfirm -U "${package[@]}"
          pacman --noconfirm -R --recursive --unneeded mingw-w64-cross-msysarm64-w32api-runtime
          pacman --noconfirm -U "${package[@]}"
          '@
          $script = $script.Replace('__BUILDROOT__', $buildRoot)
          & $bash --login -lc $script

      - name: CI-Build
        shell: pwsh
        run: |
          $env:MSYS2_PATH_TYPE = 'inherit'
          $env:PATH = 'C:\msys64\usr\bin;C:\msys64\mingw64\bin;' + $env:PATH
          $env:GIT_EXEC_PATH = 'C:\msys64\usr\lib\git-core'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $buildRoot = '${{ steps.facts.outputs.drive }}\_'
          $buildRoot = & 'C:\msys64\usr\bin\cygpath.exe' -u $buildRoot
          $script = "cd '$buildRoot' && ./.ci/ci-build.sh"
          & $bash --login -lc $script

      - name: Capture package manifest
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $artifactRoot = "${{ steps.facts.outputs.drive }}\_\artifacts"
          if (Test-Path $artifactRoot) {
            Get-ChildItem $artifactRoot -File -Filter '*.pkg.tar.*' | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "{0}  {1}" -f $hash, $_.Name
            } | Set-Content (Join-Path $artifactRoot 'sha256.txt')
          }

      - name: "Upload binaries"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: admission-build-${{ matrix.build }}
          path: ${{ steps.facts.outputs.drive }}/_/artifacts/*

  compare:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download first build
        uses: actions/download-artifact@v4
        with:
          name: admission-build-1
          path: build-1

      - name: Download second build
        uses: actions/download-artifact@v4
        with:
          name: admission-build-2
          path: build-2

      - name: Compare bytes and manifests
        shell: bash
        run: |
          set -euo pipefail
          cd build-1
          find . -maxdepth 1 -type f -name '*.pkg.tar.*' -printf '%f\n' | sort > ../files-1.txt
          cd ../build-2
          find . -maxdepth 1 -type f -name '*.pkg.tar.*' -printf '%f\n' | sort > ../files-2.txt
          cd ..
          diff -u files-1.txt files-2.txt
          while IFS= read -r pkg; do
            cmp -s "build-1/${pkg}" "build-2/${pkg}"
          done < files-1.txt
          diff -u build-1/sha256.txt build-2/sha256.txt

  smoke:
    needs: compare
    runs-on: [self-hosted, Windows, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Download admission build
        uses: actions/download-artifact@v4
        with:
          name: admission-build-1
          path: artifacts

      - name: Install candidate into a private root and smoke it
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ncurses-admission-root'
          $db = Join-Path $root 'var\lib\pacman'
          $cache = Join-Path $root 'var\cache\pacman'
          New-Item -ItemType Directory -Force -Path $db, $cache | Out-Null

          & 'C:\msys64\usr\bin\pacman.exe' --root $root --dbpath $db --cachedir $cache --noconfirm -U `
            (Join-Path $PWD 'artifacts\mingw-w64-cross-msysarm64-ncurses-6.6.20260822-1-x86_64.pkg.tar.zst') `
            (Join-Path $PWD 'artifacts\mingw-w64-cross-msysarm64-ncurses-devel-6.6.20260822-1-x86_64.pkg.tar.zst')

          $binDir = Join-Path $root 'opt\aarch64-pc-msys\bin'
          $termDir = Join-Path $root 'opt\aarch64-pc-msys\share\terminfo'
          $all = Get-ChildItem $binDir -File | Where-Object { $_.Extension -in '.exe', '.dll' }
          $symlinks = @($all | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
          $pes = @($all | Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) })
          if ($pes.Count -ne 13) { throw "Expected 13 PE files, found $($pes.Count)" }
          if ($symlinks.Count -ne 3) { throw "Expected 3 symlinks, found $($symlinks.Count)" }
          if (Test-Path (Join-Path $binDir 'msys-ncurses++w6.dll')) { throw 'Unexpected ncurses++ DLL in the candidate payload' }

          $scanner = Join-Path $env:RUNNER_TEMP 'check-aarch64-pseudo-relocs.ps1'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/crutkas/MSYS2-packages/3356eec1411983cc252b04afac32bca5f3b8d824/.ci/check-aarch64-pseudo-relocs.ps1' -OutFile $scanner
          if ((Get-FileHash -Algorithm SHA256 $scanner).Hash.ToLowerInvariant() -ne '888939b57d1bce2e3c119e7c4824703e893bd449d49a5142f040dd935741ddb9') {
            throw 'Scanner hash mismatch'
          }

          foreach ($pe in $pes) {
            $objdumpOut = & 'C:\msys64\opt\bin\aarch64-pc-cygwin-objdump.exe' -p $pe.FullName
            if ($objdumpOut -notmatch 'msys-2\.0\.dll') { throw "Missing msys-2.0.dll import: $($pe.Name)" }
            if ($objdumpOut -match 'cygwin1\.dll') { throw "Unexpected cygwin1.dll import: $($pe.Name)" }
            $json = Join-Path $env:RUNNER_TEMP ($pe.BaseName + '.json')
            & powershell -NoProfile -ExecutionPolicy Bypass -File $scanner -PePath $pe.FullName -OutputPath $json -Objdump 'C:\msys64\opt\bin\aarch64-pc-cygwin-objdump.exe' -Nm 'C:\msys64\opt\bin\aarch64-pc-cygwin-nm.exe'
          }

          $smokeSource = Join-Path $env:RUNNER_TEMP 'smoke.c'
          @'
          #define _XOPEN_SOURCE_EXTENDED 1
          #include <windows.h>
          #include <locale.h>
          #include <wchar.h>
          #include <menu.h>
          #include <panel.h>
          #include <curses.h>

          int main(void) {
            ITEM *items[2];
            MENU *menu;
            PANEL *panel;
            WINDOW *window;
            wchar_t symbol = L'W';
            cchar_t cch;

            setlocale(LC_ALL, "");
            window = initscr();
            if (window == NULL)
              return 1;
            set_escdelay(25);
            set_tabsize(8);
            setcchar(&cch, &symbol, A_NORMAL, 0, NULL);
            items[0] = new_item("one", "one");
            items[1] = NULL;
            menu = new_menu(items);
            panel = new_panel(window);
            Sleep(15000);
            if (menu != NULL)
              free_menu(menu);
            if (items[0] != NULL)
              free_item(items[0]);
            if (panel != NULL)
              del_panel(panel);
            endwin();
            return 0;
          }
          '@ | Set-Content $smokeSource -NoNewline

          $env:PATH = "$binDir;C:\msys64\usr\bin;" + $env:PATH
          $env:TERM = 'xterm-256color'
          $env:TERMINFO_DIRS = $termDir
          $smokeExe = Join-Path $env:RUNNER_TEMP 'smoke.exe'
          $gccArgs = @(
            '--sysroot=' + (Join-Path $root 'opt\aarch64-pc-msys')
            '-I' + (Join-Path $root 'opt\aarch64-pc-msys\include')
            '-I' + (Join-Path $root 'opt\aarch64-pc-msys\include\ncursesw')
            $smokeSource
            '-L' + (Join-Path $root 'opt\aarch64-pc-msys\lib')
            '-lpanelw'
            '-lmenuw'
            '-lncursesw'
            '-o'
            $smokeExe
          )
          & 'C:\msys64\opt\bin\aarch64-pc-msys-gcc.exe' @gccArgs

          $proc = Start-Process -FilePath $smokeExe -PassThru
          Start-Sleep -Seconds 3
          $modules = (Get-Process -Id $proc.Id).Modules | Select-Object -ExpandProperty ModuleName
          if ($modules -notcontains 'msys-2.0.dll') { throw 'Smoke process did not load msys-2.0.dll' }
          if ($modules -contains 'cygwin1.dll') { throw 'Smoke process loaded cygwin1.dll' }
          $proc.WaitForExit()

          & (Join-Path $binDir 'infocmp.exe') -x xterm-256color | Out-Null
          & (Join-Path $binDir 'tput.exe') cols | Out-Null
          & (Join-Path $binDir 'tset.exe') -Q | Out-Null
          & (Join-Path $binDir 'reset.exe') | Out-Null
