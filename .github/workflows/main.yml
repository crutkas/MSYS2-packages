name: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build:
    if: >-
      ${{
        (github.event_name != 'push' || github.ref != 'refs/heads/master') &&
        (github.repository != 'crutkas/MSYS2-packages' ||
         github.event_name != 'push' ||
         (github.ref_type != 'tag' &&
          github.ref_name != 'crutkas-package-aarch64-static-libgcc'))
      }}
    env:
      CI_BASE_REPOSITORY: https://github.com/${{ github.repository }}.git
      CI_BASE_REF: ${{ github.event.pull_request.base.ref || ((github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error') && 'crutkas-congenial-system' || 'master') }}
      CI_PACKAGE_PREFIXES: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error')) && 'mingw-w64-cross-cygwinarm64- mingw-w64-cross-msysarm64-' || '' }}
      CI_RUN_CHECK: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error')) && '1' || '0' }}
      CI_CANONICALIZE_PACKAGES: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error')) && '1' || '0' }}
      SOURCE_DATE_EPOCH: 1786817435
      MSYS: winsymlinks:sys
    strategy:
      fail-fast: false
      matrix:
        include: [
          { msystem: MSYS, runner: windows-2025 },
        ]
    name: ${{ matrix.msystem }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Gather Facts
        id: facts
        run : |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize -Wrap
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name
          $BUILD_DRIVE = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          echo "drive=$BUILD_DRIVE" >> $env:GITHUB_OUTPUT

      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          path: temp
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Add staging repo
        shell: pwsh
        run: |
          $pacmanConf = 'C:\msys64\etc\pacman.conf'
          $contents = Get-Content $pacmanConf -Raw
          if ($contents -notmatch '^\[staging\]') {
            $contents = "[staging]`nServer = https://repo.msys2.org/staging/`nSigLevel = Never`n$contents"
          }
          Set-Content $pacmanConf -Value $contents -NoNewline

      - name: Update using staging
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suuy
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suu
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm --needed -S git python base-devel

      - name: Download fork-local AArch64 Cygwin inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'cygwinarm64-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download cygwinarm64-binutils-pr21-3356eec-20260827 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-gcc-static-runtime-20260815 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-stage1-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-sysroot-pr3-20260813 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-headers-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-windows-default-manifest-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-sysroot-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-w32api-20260813 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-w32api-runtime-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-libstdcxx-headers-pr7-20260815 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-libstdc++-headers-*.pkg.tar.zst' `
            --dir $destination

          $expected = @{
            'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' = '3c7b47529181dab726d22cf6ed045184260af915eea583488c13c07e478ac02b'
            'mingw-w64-cross-cygwinarm64-headers-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = '5266346cc10b142f871704ce4277699b1a5daa3121dc869990b4bedce69c0611'
            'mingw-w64-cross-cygwinarm64-windows-default-manifest-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = 'cc089511fede6042a25f83fcb5903fddeede89ddd9655360741513ee9015e3dc'
            'mingw-w64-cross-cygwinarm64-sysroot-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = '4ed8a30f592317bf7e4def6f3c773139f2565b0f8afaedd820f7ee46d33cad20'
            'mingw-w64-cross-cygwinarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' = '53478f9a60e2fdad7d3b4357fa4fb937a1afab16af16a55e5a25ae9fac308fa7'
            'mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '063579211851ed69370a6362f2795e39d9be0235a2bfe2f58da1bbd73a1d108e'
            'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '17a8fbc22227c541ff3179179d307045302f6b18fbc6207cf9d863a9e4dad98c'
            'mingw-w64-cross-cygwinarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' = '1e018d384e5e16b76524b69677819b660e6611480a85a7f7b8a412403bf15ea6'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 Cygwin inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        run: |
          $input_dir = Join-Path $env:RUNNER_TEMP 'cygwinarm64-inputs'
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U `
            "$input_dir\mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-headers-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-windows-default-manifest-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-sysroot-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-cygwinarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst"

      - name: Download fork-local AArch64 MSYS runtime/sysroot release
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'msysarm64-runtime-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download msysarm64-runtime-pr10-a527-20260824 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-headers-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-windows-default-manifest-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-sysroot-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-devel-*.pkg.tar.zst' `
            --dir $destination

          $expected = @{
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '263f8f7e3614ac41337ce3a223f2bb26b6459aef6f34670525cdd4c03ec3ae21'
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '33861708e7f981b4eef5b93ef135ab3a43d2757533f64df6f61a146d823c355f'
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'e30609e09eab2fa07aba2e6196b05f34e5e9107abc4ab8832966684758c743ca'
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'c18b51e483991770b8e06cc2d8f7002d06784d3071ac213a8fee24bb831267d1'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 MSYS runtime/sysroot release
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        run: |
          $input_dir = Join-Path $env:RUNNER_TEMP 'msysarm64-runtime-inputs'
          $env:MSYS = 'winsymlinks:sys'
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U `
            "$input_dir\mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst"

      - name: Download fork-local AArch64 MSYS GCC release
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'msysarm64-gcc-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download msysarm64-gcc-pr13-20260826 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-gcc-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-gcc-libs-*.pkg.tar.zst' `
            --dir $destination
          gh release download msysarm64-gcc-pr13-support-20260826 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-libstdc++-headers-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-w32api-runtime-*.pkg.tar.zst' `
            --dir $destination

          $expected = @{
            'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' = 'a74887c76a933ec424933bf662729d94975b83138af783bd93f2e7acd95c3a22'
            'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' = '990f163cacf9ffce1b58445be91fedc57f135cc26a88d7dba109806446b41438'
            'mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' = '9715aab6894379bf5ab936a3a559f286fb4aedbb64f0774d7457182e00648e08'
            'mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' = '7727936f4212e5af04e9739eca60f157c0875796c1e82fcfb79fd4398b111e24'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 MSYS GCC release
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        run: |
          $input_dir = Join-Path $env:RUNNER_TEMP 'msysarm64-gcc-inputs'
          $env:MSYS = 'winsymlinks:sys'
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U `
            "$input_dir\mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst"

      - name: Preflight fork-local AArch64 MSYS inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        run: |
          $packages = @(
            'mingw-w64-cross-msysarm64-headers',
            'mingw-w64-cross-msysarm64-windows-default-manifest',
            'mingw-w64-cross-msysarm64-sysroot',
            'mingw-w64-cross-msysarm64-runtime',
            'mingw-w64-cross-msysarm64-runtime-devel',
            'mingw-w64-cross-msysarm64-gcc',
            'mingw-w64-cross-msysarm64-gcc-libs',
            'mingw-w64-cross-cygwinarm64-binutils',
            'mingw-w64-cross-msysarm64-libstdc++-headers',
            'mingw-w64-cross-msysarm64-w32api-runtime'
          )
          foreach ($pkg in $packages) {
            & 'C:\msys64\usr\bin\pacman.exe' -Q $pkg
          }
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $script = @'
          set -euo pipefail
          LIBRARY_PATH=/opt/lib/gcc/aarch64-pc-msys/15.0.1:/opt/aarch64-pc-msys/lib
          libgcc=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-msys-gcc -print-file-name=libgcc.a)
          libkernel32=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-msys-gcc -print-file-name=libkernel32.a)
          libntdll=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-msys-gcc -print-file-name=libntdll.a)
          for path in "$libgcc" "$libkernel32" "$libntdll"; do
            test -f "$path"
            aarch64-pc-msys-objdump -f "$path" | grep -F 'architecture: aarch64'
          done
          test "$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-msys-gcc -dumpmachine)" = 'aarch64-pc-msys'
          '@
          & $bash --login -lc $script

      - name: Verify package-owned MSYS tool bridges
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
        shell: pwsh
        run: |
          $binDir = 'C:\msys64\opt\bin'
          $tools = @('ar', 'ld', 'nm', 'objdump', 'ranlib')
          foreach ($tool in $tools) {
            $msysPath = "/opt/bin/aarch64-pc-msys-$tool.exe"
            $owner = & 'C:\msys64\usr\bin\pacman.exe' -Qqo $msysPath
            if ($LASTEXITCODE -ne 0 -or
                $owner -ne 'mingw-w64-cross-cygwinarm64-binutils') {
              throw "Bridge is not package-owned by fixed binutils: $msysPath"
            }
          }
          $ld = Join-Path $binDir 'aarch64-pc-cygwin-ld.exe'
          if ((Get-FileHash -Algorithm SHA256 $ld).Hash.ToLowerInvariant() -ne
              '075ed377a430eb120a994dfdc7c3187e937331239204578d696f08ee1c72fb1f') {
            throw 'Canonical linker SHA-256 mismatch'
          }

      - name: Move Checkout
        run: |
          $path = "${{ steps.facts.outputs.drive }}\_"
          If (Test-Path "$path") { rm -r -fo "$path" }
          Move-Item -Path ".\temp" -Destination "$path"

      - name: CI-Build
        shell: pwsh
        run: |
          $env:MSYS2_PATH_TYPE = 'inherit'
          $env:PATH = 'C:\msys64\usr\bin;C:\msys64\mingw64\bin;' + $env:PATH
          $env:GIT_EXEC_PATH = 'C:\msys64\usr\lib\git-core'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $buildRoot = '${{ steps.facts.outputs.drive }}\_'
          $buildRoot = & 'C:\msys64\usr\bin\cygpath.exe' -u $buildRoot
          $script = "cd '$buildRoot' && ./.ci/ci-build.sh"
          & $bash --login -lc $script

      - name: "Upload binaries"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-packages
          path: ${{ steps.facts.outputs.drive }}/_/artifacts/*.pkg.tar.*

      - name: "Upload debug logs"
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-libstdcxx-debug
          path: ${{ steps.facts.outputs.drive }}/_/mingw-w64-cross-msysarm64-libstdcxx-headers/src/libstdcxx-headers-report/*

  native-libgpg-error:
    if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-arm64-libgpg-error' || github.head_ref == 'crutkas-arm64-libgpg-error') }}
    needs: build
    runs-on: windows-11-arm
    env:
      MSYS: winsymlinks:sys

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: base-devel gcc
          path-type: inherit

      - uses: actions/download-artifact@v4
        with:
          name: MSYS-packages
          path: artifacts

      - name: Download canonical ARM64 inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'native-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download cygwinarm64-binutils-pr21-3356eec-20260827 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' `
            --dir $destination
          gh release download msysarm64-runtime-pr10-a527-20260824 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-*.pkg.tar.zst' `
            --dir $destination
          gh release download msysarm64-gcc-pr13-support-20260826 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-libstdc++-headers-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-w32api-runtime-*.pkg.tar.zst' `
            --dir $destination
          gh release download msysarm64-gcc-pr13-20260826 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' `
            --dir $destination

          $expected = @{
            'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' = '3c7b47529181dab726d22cf6ed045184260af915eea583488c13c07e478ac02b'
            'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' = 'a74887c76a933ec424933bf662729d94975b83138af783bd93f2e7acd95c3a22'
            'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' = '990f163cacf9ffce1b58445be91fedc57f135cc26a88d7dba109806446b41438'
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '263f8f7e3614ac41337ce3a223f2bb26b6459aef6f34670525cdd4c03ec3ae21'
            'mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' = '9715aab6894379bf5ab936a3a559f286fb4aedbb64f0774d7457182e00648e08'
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'c18b51e483991770b8e06cc2d8f7002d06784d3071ac213a8fee24bb831267d1'
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'e30609e09eab2fa07aba2e6196b05f34e5e9107abc4ab8832966684758c743ca'
            'mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' = '7727936f4212e5af04e9739eca60f157c0875796c1e82fcfb79fd4398b111e24'
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '33861708e7f981b4eef5b93ef135ab3a43d2757533f64df6f61a146d823c355f'
          }
          $manifest = foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($hash -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
            "$hash  $($entry.Key)"
          }
          $manifest | Set-Content (Join-Path $env:RUNNER_TEMP 'native-inputs.sha256')
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'artifacts\*.pkg.tar.zst') |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Length)  $($_.Name)"
            } | Set-Content (Join-Path $env:RUNNER_TEMP 'native-packages.sha256')

      - name: Install canonical inputs and packages
        shell: msys2 {0}
        run: |
          set -euo pipefail
          inputs="$(cygpath -u "$RUNNER_TEMP")/native-inputs"
          artifacts="$(cygpath -u "$GITHUB_WORKSPACE")/artifacts"
          pacman --noconfirm \
            --assume-installed mingw-w64-cross-cygwinarm64-gcc-stage1=15.0.1dev-2 \
            -U \
            "$inputs/mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst" \
            "$inputs/mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst"
          pacman -Qo /opt/bin/aarch64-pc-cygwin-ld.exe
          test "$(sha256sum /opt/bin/aarch64-pc-cygwin-ld.exe | cut -d' ' -f1)" = \
            075ed377a430eb120a994dfdc7c3187e937331239204578d696f08ee1c72fb1f
          pacman --noconfirm -U \
            "$artifacts/mingw-w64-cross-msysarm64-libgpg-error-1.56-1-x86_64.pkg.tar.zst" \
            "$artifacts/mingw-w64-cross-msysarm64-libgpg-error-devel-1.56-1-x86_64.pkg.tar.zst"
          echo "MSYS_ROOT=$(cygpath -w /)" >> "$GITHUB_ENV"

      - name: Build native static and dynamic consumers
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/opt/bin:$PATH"
          output="$(cygpath -u "$RUNNER_TEMP")/libgpg-error-native"
          mkdir -p "$output"
          cat > "$output/consumer.c" <<'EOF'
          #include <gpg-error.h>
          #include <unistd.h>

          int main(void) {
            const char *version = gpg_error_check_version(GPG_ERROR_VERSION);
            gpg_error_t error = gpg_error(GPG_ERR_GENERAL);
            const char *message = gpg_strerror(error);
            sleep(5);
            return !(version && message && gpg_err_code(error) == GPG_ERR_GENERAL);
          }
          EOF
          include=/opt/aarch64-pc-msys/usr/include
          lib=/opt/aarch64-pc-msys/usr/lib
          aarch64-pc-msys-gcc -B/opt/bin/ -I"$include" "$output/consumer.c" \
            "$lib/libgpg-error.dll.a" -o "$output/dynamic-consumer.exe"
          aarch64-pc-msys-gcc -B/opt/bin/ -I"$include" "$output/consumer.c" \
            "$lib/libgpg-error.a" -o "$output/static-consumer.exe"
          for exe in "$output"/*.exe; do
            aarch64-pc-cygwin-objdump -f "$exe" | grep -F 'file format pei-aarch64-little'
            aarch64-pc-cygwin-objdump -f "$exe" | grep -F 'architecture: aarch64'
            ! aarch64-pc-cygwin-objdump -p "$exe" | grep -Eiq 'cygwin1\.dll|x86_64'
          done

      - name: Execute and inspect native consumers
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'native-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $proof = @(
            "OSArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
            "ProcessArchitecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
            (Get-CimInstance Win32_Processor | Format-List Name,Architecture,AddressWidth | Out-String)
          )
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw 'windows-11-arm did not report an ARM64 operating system'
          }

          $targetBin = Join-Path $env:MSYS_ROOT 'opt\aarch64-pc-msys\usr\bin'
          $env:PATH = "$targetBin;$env:PATH"
          foreach ($kind in @('dynamic', 'static')) {
            $exe = Join-Path $env:RUNNER_TEMP "libgpg-error-native\$kind-consumer.exe"
            $process = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 1
            $process.Refresh()
            $modules = @($process.Modules | ForEach-Object ModuleName)
            $proof += "$kind PID=$($process.Id) modules=$($modules -join ',')"
            if ($modules -notcontains 'msys-2.0.dll') {
              throw "$kind consumer did not load msys-2.0.dll"
            }
            if ($kind -eq 'dynamic' -and $modules -notcontains 'msys-gpg-error-0.dll') {
              throw 'dynamic consumer did not load msys-gpg-error-0.dll'
            }
            if ($kind -eq 'static' -and $modules -contains 'msys-gpg-error-0.dll') {
              throw 'static consumer unexpectedly loaded msys-gpg-error-0.dll'
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "$kind consumer exited with $($process.ExitCode)"
            }
            $proof += "$kind exit=0"
          }
          $proof | Tee-Object -FilePath (Join-Path $evidence 'native-proof.txt')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'native-inputs.sha256') $evidence
          Copy-Item (Join-Path $env:RUNNER_TEMP 'native-packages.sha256') $evidence
          Copy-Item (Join-Path $env:RUNNER_TEMP 'libgpg-error-native\*.exe') $evidence

      - uses: actions/upload-artifact@v4
        with:
          name: windows-11-arm-libgpg-error-native
          path: ${{ runner.temp }}/native-evidence/*

  package-grokker:
    if: ${{ !(github.repository == 'crutkas/MSYS2-packages' && github.head_ref == 'crutkas-package-aarch64-static-libgcc') }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: MSYS-packages
          path: artifacts
      - name: Grok packages
        uses: jeremyd2019/package-grokker/grok-artifacts@main
        if: steps.artifacts.outcome == 'success'
        with:
          repo: msys
          path: artifacts
