name: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build:
    if: >-
      ${{
        (github.event_name != 'push' || github.ref != 'refs/heads/master') &&
        (github.repository != 'crutkas/MSYS2-packages' ||
         github.event_name != 'push' ||
         (github.ref_type != 'tag' &&
          github.ref_name != 'crutkas-package-aarch64-static-libgcc'))
      }}
    env:
      CI_BASE_REPOSITORY: https://github.com/${{ github.repository }}.git
      CI_BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
      CI_PACKAGE_PREFIXES: ''
      CI_RUN_CHECK: '0'
      CI_CANONICALIZE_PACKAGES: '0'
      SOURCE_DATE_EPOCH: 1786817435
    strategy:
      fail-fast: false
      matrix:
        include: [
          { msystem: MSYS, runner: windows-2025 },
        ]
    name: ${{ matrix.msystem }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Gather Facts
        id: facts
        run : |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize -Wrap
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name
          $BUILD_DRIVE = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          echo "drive=$BUILD_DRIVE" >> $env:GITHUB_OUTPUT

      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          path: temp
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Resolve fork-local AArch64 settings
        id: arm64-settings
        shell: pwsh
        run: |
          $branchCandidates = @('${{ github.ref_name }}', '${{ github.head_ref }}') | Where-Object { $_ }
          $match = @('crutkas-package-aarch64-static-libgcc', 'crutkas-congenial-system', 'crutkas-aarch64-gcc-layer', 'crutkas-arm64-msys-expat') |
            Where-Object { $branchCandidates -contains $_ } |
            Select-Object -First 1
          if (-not $match) {
            "enabled=0" >> $env:GITHUB_OUTPUT
            "consumer=0" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $baseRef = switch ($match) {
            'crutkas-arm64-msys-expat' { 'crutkas-aarch64-gcc-layer' }
            'crutkas-aarch64-gcc-layer' { 'crutkas-package-aarch64-static-libgcc' }
            'crutkas-congenial-system' { 'crutkas-package-aarch64-static-libgcc' }
            default { 'master' }
          }
          $prefixes = 'mingw-w64-cross-cygwinarm64- mingw-w64-cross-msysarm64-'

          "enabled=1" >> $env:GITHUB_OUTPUT
          "consumer=$(if ($match -eq 'crutkas-arm64-msys-expat') { '1' } else { '0' })" >> $env:GITHUB_OUTPUT
          "base_ref=$baseRef" >> $env:GITHUB_OUTPUT
          "package_prefixes=$prefixes" >> $env:GITHUB_OUTPUT
          "run_check=1" >> $env:GITHUB_OUTPUT
          "canonicalize_packages=1" >> $env:GITHUB_OUTPUT
          "CI_BASE_REF=$baseRef" >> $env:GITHUB_ENV
          "CI_PACKAGE_PREFIXES=$prefixes" >> $env:GITHUB_ENV
          "CI_RUN_CHECK=1" >> $env:GITHUB_ENV
          "CI_CANONICALIZE_PACKAGES=1" >> $env:GITHUB_ENV

      - name: Add staging repo
        shell: pwsh
        run: |
          $pacmanConf = 'C:\msys64\etc\pacman.conf'
          $contents = Get-Content $pacmanConf -Raw
          if ($contents -notmatch '^\[staging\]') {
            $contents = "[staging]`nServer = https://repo.msys2.org/staging/`nSigLevel = Never`n$contents"
          }
          Set-Content $pacmanConf -Value $contents -NoNewline

      - name: Update using staging
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suuy
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -Suu
          & 'C:\msys64\usr\bin\pacman.exe' --noconfirm --needed -S git python base-devel

      - name: Download fork-local AArch64 Cygwin inputs
        if: ${{ steps.arm64-settings.outputs.enabled == '1' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'cygwinarm64-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download cygwinarm64-binutils-pr21-3356eec-20260827 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-gcc-static-runtime-20260815 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-stage1-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-sysroot-pr3-20260813 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-headers-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-windows-default-manifest-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-sysroot-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-w32api-20260813 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-w32api-runtime-*.pkg.tar.zst' `
            --dir $destination
          gh release download cygwinarm64-libstdcxx-headers-pr7-20260815 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-cygwinarm64-libstdc++-headers-*.pkg.tar.zst' `
            --dir $destination

          $expected = @{
            'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' = '3c7b47529181dab726d22cf6ed045184260af915eea583488c13c07e478ac02b'
            'mingw-w64-cross-cygwinarm64-headers-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = '5266346cc10b142f871704ce4277699b1a5daa3121dc869990b4bedce69c0611'
            'mingw-w64-cross-cygwinarm64-windows-default-manifest-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = 'cc089511fede6042a25f83fcb5903fddeede89ddd9655360741513ee9015e3dc'
            'mingw-w64-cross-cygwinarm64-sysroot-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst' = '4ed8a30f592317bf7e4def6f3c773139f2565b0f8afaedd820f7ee46d33cad20'
            'mingw-w64-cross-cygwinarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' = '53478f9a60e2fdad7d3b4357fa4fb937a1afab16af16a55e5a25ae9fac308fa7'
            'mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '063579211851ed69370a6362f2795e39d9be0235a2bfe2f58da1bbd73a1d108e'
            'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '17a8fbc22227c541ff3179179d307045302f6b18fbc6207cf9d863a9e4dad98c'
            'mingw-w64-cross-cygwinarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' = '1e018d384e5e16b76524b69677819b660e6611480a85a7f7b8a412403bf15ea6'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 Cygwin inputs
        if: ${{ steps.arm64-settings.outputs.enabled == '1' }}
        shell: pwsh
        run: |
          $input_dir = Join-Path $env:RUNNER_TEMP 'cygwinarm64-inputs'
          $savedMsys = $env:MSYS
          try {
            $env:MSYS = 'winsymlinks:sys'
            & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U `
              "$input_dir\mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst" `
              "$input_dir\mingw-w64-cross-cygwinarm64-headers-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
              "$input_dir\mingw-w64-cross-cygwinarm64-windows-default-manifest-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
              "$input_dir\mingw-w64-cross-cygwinarm64-sysroot-3.6.10.r0.gee50e0223-1-x86_64.pkg.tar.zst" `
              "$input_dir\mingw-w64-cross-cygwinarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst" `
              "$input_dir\mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst" `
              "$input_dir\mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst" `
              "$input_dir\mingw-w64-cross-cygwinarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst"
            if ($LASTEXITCODE -ne 0) {
              throw "AArch64 Cygwin bootstrap transaction failed: $LASTEXITCODE"
            }
          } finally {
            $env:MSYS = $savedMsys
          }

      - name: Preflight fork-local AArch64 Cygwin inputs
        if: ${{ steps.arm64-settings.outputs.enabled == '1' }}
        shell: pwsh
        run: |
          $packages = @(
            'mingw-w64-cross-cygwinarm64-gcc-stage1',
            'mingw-w64-cross-cygwinarm64-gcc-libs-stage1',
            'mingw-w64-cross-cygwinarm64-binutils',
            'mingw-w64-cross-cygwinarm64-libstdc++-headers'
          )
          foreach ($pkg in $packages) {
            & 'C:\msys64\usr\bin\pacman.exe' -Q $pkg
          }
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $script = @'
          set -euo pipefail
          test "$(pacman -Q mingw-w64-cross-cygwinarm64-binutils)" = \
            'mingw-w64-cross-cygwinarm64-binutils 2.44.50-2'
          test "$(sha256sum /opt/bin/aarch64-pc-cygwin-ld.exe | cut -d' ' -f1)" = \
            '075ed377a430eb120a994dfdc7c3187e937331239204578d696f08ee1c72fb1f'
          for tool in \
            addr2line ar as c++filt dlltool dllwrap elfedit gprof ld ld.bfd \
            nm objcopy objdump ranlib readelf size strings strip windmc windres
          do
            alias="/opt/bin/aarch64-pc-msys-${tool}.exe"
            test -L "$alias"
            test "$(readlink "$alias")" = "aarch64-pc-cygwin-${tool}.exe"
          done
          LIBRARY_PATH=/opt/lib/gcc/aarch64-pc-cygwin/15.0.1:/opt/aarch64-pc-msys/lib
          libgcc=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-cygwin-gcc -print-file-name=libgcc.a)
          libkernel32=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-cygwin-gcc -print-file-name=libkernel32.a)
          libntdll=$(LIBRARY_PATH="$LIBRARY_PATH" aarch64-pc-cygwin-gcc -print-file-name=libntdll.a)
          for path in "$libgcc" "$libkernel32" "$libntdll"; do
            test -f "$path"
            aarch64-pc-cygwin-objdump -f "$path" | grep -F 'architecture: aarch64'
          done
          '@
          & $bash --login -lc $script

      - name: Add MSYS tool aliases
        if: ${{ steps.arm64-settings.outputs.enabled == '1' }}
        shell: pwsh
        run: |
          $binDir = 'C:\msys64\opt\bin'
          $tools = @('as', 'ld', 'ar', 'nm', 'objcopy', 'objdump', 'ranlib', 'strip', 'windres', 'dlltool', 'readelf', 'size', 'addr2line', 'strings')
          foreach ($tool in $tools) {
            $source = Join-Path $binDir "aarch64-pc-cygwin-$tool.exe"
            $dest = Join-Path $binDir "aarch64-pc-msys-$tool.exe"
            if ((Test-Path $source) -and -not (Test-Path $dest)) {
              Copy-Item $source $dest
            }
          }

      - name: Install final fork-local AArch64 MSYS toolchain
        if: ${{ steps.arm64-settings.outputs.consumer == '1' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'msysarm64-final-toolchain'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          gh release download msysarm64-runtime-pr10-a527-20260824 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --dir $destination
          gh release download msysarm64-gcc-pr13-20260826 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' `
            --dir $destination
          gh release download msysarm64-gcc-pr13-support-20260826 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' `
            --dir $destination

          $expected = [ordered]@{
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '263f8f7e3614ac41337ce3a223f2bb26b6459aef6f34670525cdd4c03ec3ae21'
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '33861708e7f981b4eef5b93ef135ab3a43d2757533f64df6f61a146d823c355f'
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'e30609e09eab2fa07aba2e6196b05f34e5e9107abc4ab8832966684758c743ca'
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'c18b51e483991770b8e06cc2d8f7002d06784d3071ac213a8fee24bb831267d1'
            'mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' = '7727936f4212e5af04e9739eca60f157c0875796c1e82fcfb79fd4398b111e24'
            'mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' = '9715aab6894379bf5ab936a3a559f286fb4aedbb64f0774d7457182e00648e08'
            'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' = '990f163cacf9ffce1b58445be91fedc57f135cc26a88d7dba109806446b41438'
            'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' = 'a74887c76a933ec424933bf662729d94975b83138af783bd93f2e7acd95c3a22'
          }
          $downloaded = @(Get-ChildItem $destination -File)
          if ($downloaded.Count -ne $expected.Count) {
            throw "Expected $($expected.Count) final toolchain assets, found $($downloaded.Count)"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

          $packages = @($expected.Keys | ForEach-Object { Join-Path $destination $_ })
          $savedMsys = $env:MSYS
          try {
            $env:MSYS = 'winsymlinks:sys'
            & 'C:\msys64\usr\bin\pacman.exe' --noconfirm -U $packages
            if ($LASTEXITCODE -ne 0) {
              throw "Atomic AArch64 MSYS toolchain install failed: $LASTEXITCODE"
            }
          } finally {
            $env:MSYS = $savedMsys
          }

          $identities = [ordered]@{
            'mingw-w64-cross-msysarm64-headers' = '3.6.10.r0.ga527ace21-1'
            'mingw-w64-cross-msysarm64-windows-default-manifest' = '3.6.10.r0.ga527ace21-1'
            'mingw-w64-cross-msysarm64-sysroot' = '3.6.10.r0.ga527ace21-1'
            'mingw-w64-cross-msysarm64-runtime' = '3.6.10.r0.ga527ace21-1'
            'mingw-w64-cross-msysarm64-runtime-devel' = '3.6.10.r0.ga527ace21-1'
            'mingw-w64-cross-msysarm64-w32api-runtime' = '14.0.0.r0.g9b3dd0125-1'
            'mingw-w64-cross-msysarm64-libstdc++-headers' = '15.0.1dev-1'
            'mingw-w64-cross-msysarm64-gcc-libs' = '15.0.1dev-1'
            'mingw-w64-cross-msysarm64-gcc' = '15.0.1dev-1'
          }
          foreach ($entry in $identities.GetEnumerator()) {
            $actual = (& 'C:\msys64\usr\bin\pacman.exe' -Q $entry.Key) -join ''
            if ($actual -ne "$($entry.Key) $($entry.Value)") {
              throw "Installed identity mismatch: $actual"
            }
          }

          $env:MSYSTEM = 'MSYS'
          $env:MSYS2_PATH_TYPE = 'inherit'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $script = @'
          set -euo pipefail
          export PATH=/usr/bin:/opt/bin:$PATH
          test "$(aarch64-pc-msys-gcc -dumpmachine)" = aarch64-pc-msys
          test "$(aarch64-pc-msys-gcc -dumpversion)" = 15.0.1
          printf '' | aarch64-pc-msys-gcc -dM -E - | grep -Fx '#define __aarch64__ 1'
          printf '' | aarch64-pc-msys-gcc -dM -E - | grep -Fx '#define __MSYS__ 1'
          printf '' | aarch64-pc-msys-gcc -dM -E - | grep -Fx '#define _WIN64 1'
          test -z "$(pacman -T \
            mingw-w64-cross-msysarm64-gcc=15.0.1dev-1 \
            mingw-w64-cross-msysarm64-gcc-libs=15.0.1dev-1 \
            mingw-w64-cross-msysarm64-runtime=3.6.10.r0.ga527ace21-1 \
            mingw-w64-cross-msysarm64-runtime-devel=3.6.10.r0.ga527ace21-1 \
            mingw-w64-cross-msysarm64-sysroot=3.6.10.r0.ga527ace21-1 \
            mingw-w64-cross-msysarm64-w32api-runtime=14.0.0.r0.g9b3dd0125-1)"
          '@
          & $bash --login -lc $script
          if ($LASTEXITCODE -ne 0) {
            throw "Final AArch64 MSYS toolchain preflight failed: $LASTEXITCODE"
          }

      - name: Move Checkout
        run: |
          $path = "${{ steps.facts.outputs.drive }}\_"
          If (Test-Path "$path") { rm -r -fo "$path" }
          Move-Item -Path ".\temp" -Destination "$path"

      - name: CI-Build
        shell: pwsh
        run: |
          $env:MSYS2_PATH_TYPE = 'inherit'
          $env:PATH = 'C:\msys64\usr\bin;C:\msys64\mingw64\bin;' + $env:PATH
          $env:GIT_EXEC_PATH = 'C:\msys64\usr\lib\git-core'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $buildRoot = '${{ steps.facts.outputs.drive }}\_'
          $buildRoot = & 'C:\msys64\usr\bin\cygpath.exe' -u $buildRoot
          $script = "cd '$buildRoot' && ./.ci/ci-build.sh"
          & $bash --login -lc $script

      - name: Validate ARM64 Expat package transactions
        if: ${{ steps.arm64-settings.outputs.consumer == '1' }}
        shell: pwsh
        run: |
          $env:MSYSTEM = 'MSYS'
          $env:MSYS2_PATH_TYPE = 'inherit'
          $env:PATH = 'C:\msys64\usr\bin;C:\msys64\mingw64\bin;' + $env:PATH
          $bash = 'C:\msys64\usr\bin\bash.exe'
          $buildRoot = '${{ steps.facts.outputs.drive }}\_'
          $buildRoot = & 'C:\msys64\usr\bin\cygpath.exe' -u $buildRoot
          $finalInputs = & 'C:\msys64\usr\bin\cygpath.exe' -u `
            (Join-Path $env:RUNNER_TEMP 'msysarm64-final-toolchain')
          $bootstrapInputs = & 'C:\msys64\usr\bin\cygpath.exe' -u `
            (Join-Path $env:RUNNER_TEMP 'cygwinarm64-inputs')
          $script = "cd '$buildRoot' && ./mingw-w64-cross-msysarm64-expat/validate-expat-packages.sh artifacts expat-ci-report '$finalInputs' '$bootstrapInputs'"
          & $bash --login -lc $script
          if ($LASTEXITCODE -ne 0) {
            throw "ARM64 Expat package transaction validation failed: $LASTEXITCODE"
          }

      - name: "Upload binaries"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-packages
          path: ${{ steps.facts.outputs.drive }}/_/artifacts/*.pkg.tar.*

      - name: Upload ARM64 Expat validation
        if: ${{ always() && !cancelled() && steps.arm64-settings.outputs.consumer == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-expat-validation
          path: ${{ steps.facts.outputs.drive }}/_/expat-ci-report

      - name: "Upload debug logs"
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-libstdcxx-debug
          path: |
            ${{ steps.facts.outputs.drive }}/_/mingw-w64-cross-msysarm64-libstdcxx-headers/src/libstdcxx-headers-report/*
            ${{ steps.facts.outputs.drive }}/_/mingw-w64-cross-msysarm64-gcc/src/gcc-report/*

  native-expat:
    if: >-
      ${{
        github.repository == 'crutkas/MSYS2-packages' &&
        (github.ref_name == 'crutkas-arm64-msys-expat' ||
         github.head_ref == 'crutkas-arm64-msys-expat')
      }}
    needs: build
    name: Native ARM64 Expat
    runs-on: windows-11-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          cache: false
          install: >-
            gmp
            isl
            libiconv
            libintl
            libzstd
            mpc
            mpfr
            zlib
          msystem: MSYS
          update: true

      - uses: actions/download-artifact@v4
        with:
          name: MSYS-packages
          path: ${{ runner.temp }}/expat-packages

      - name: Run native ARM64 Expat validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .\.ci\native-arm64-expat-smoke.ps1 `
            -MsysRoot '${{ steps.msys2.outputs.msys2-location }}' `
            -PackageDir '${{ runner.temp }}\expat-packages' `
            -ReportRoot '${{ runner.temp }}\native-arm64-expat-report' `
            -BinutilsReleaseTag 'cygwinarm64-binutils-pr21-3356eec-20260827' `
            -BinutilsAssetName 'mingw-w64-cross-cygwinarm64-binutils-2.44.50-2-x86_64.pkg.tar.zst' `
            -BinutilsSha256 '3c7b47529181dab726d22cf6ed045184260af915eea583488c13c07e478ac02b' `
            -BinutilsVersion '2.44.50-2'

      - name: Upload native ARM64 Expat evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: native-arm64-expat-evidence
          path: ${{ runner.temp }}/native-arm64-expat-report
          retention-days: 30

  package-grokker:
    if: ${{ !(github.repository == 'crutkas/MSYS2-packages' && github.head_ref == 'crutkas-package-aarch64-static-libgcc') }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: MSYS-packages
          path: artifacts
      - name: Grok packages
        uses: jeremyd2019/package-grokker/grok-artifacts@main
        if: steps.artifacts.outcome == 'success'
        with:
          repo: msys
          path: artifacts
