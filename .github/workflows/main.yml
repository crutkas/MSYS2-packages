name: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build:
    if: >-
      ${{
        (github.event_name != 'push' || github.ref != 'refs/heads/master') &&
        (github.repository != 'crutkas/MSYS2-packages' ||
         github.event_name != 'push' ||
         (github.ref_type != 'tag' &&
          github.ref_name != 'crutkas-package-aarch64-static-libgcc'))
      }}
    env:
      CI_BASE_REPOSITORY: https://github.com/${{ github.repository }}.git
      CI_BASE_REF: ${{ github.event.pull_request.base.ref || (github.ref_name == 'crutkas-arm64-msys-perl' && 'crutkas-congenial-system' || github.ref_name == 'crutkas-congenial-system' && 'crutkas-package-aarch64-static-libgcc' || 'master') }}
      CI_PACKAGE_PREFIXES: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-arm64-msys-perl' || github.head_ref == 'crutkas-arm64-msys-perl')) && 'perl' || (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system')) && 'mingw-w64-cross-cygwinarm64- mingw-w64-cross-msysarm64-' || '' }}
      CI_RUN_CHECK: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-arm64-msys-perl' || github.head_ref == 'crutkas-arm64-msys-perl' || github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system')) && '1' || '0' }}
      CI_CANONICALIZE_PACKAGES: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-arm64-msys-perl' || github.head_ref == 'crutkas-arm64-msys-perl' || github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system')) && '1' || '0' }}
      SOURCE_DATE_EPOCH: 1786817435
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-arm64-msys-perl' || github.head_ref == 'crutkas-arm64-msys-perl')) && 'CLANGARM64' || 'MSYS' }}
            runner: ${{ (github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-arm64-msys-perl' || github.head_ref == 'crutkas-arm64-msys-perl')) && 'windows-11-arm' || 'windows-2025' }}
    name: ${{ matrix.msystem }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Gather Facts
        id: facts
        run : |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize -Wrap
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name
          $BUILD_DRIVE = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          echo "drive=$BUILD_DRIVE" >> $env:GITHUB_OUTPUT

      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          path: temp
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Validate recipe and workflow text
        shell: pwsh
        run: |
          python -c "from pathlib import Path; files=[Path(r'temp\perl\PKGBUILD'), Path(r'temp\.github\workflows\main.yml')]; allowed={9,10,13}; bad=[f'{path}:{idx}:0x{b:02x}' for path in files for idx,b in enumerate(path.read_bytes(),1) if b < 32 and b not in allowed]; assert not bad, 'Control characters found:\n' + '\n'.join(bad)"

      - name: Init MSYS2
        id: msys2
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-arm64-msys-perl' || github.head_ref == 'crutkas-arm64-msys-perl' || github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.head_ref == 'crutkas-congenial-system') }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: git python base-devel

      - name: Add staging repo
        shell: pwsh
        run: |
          $repoRoot = Join-Path $env:GITHUB_WORKSPACE 'temp'
          $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
          $etcDir = Join-Path $msys2Root 'etc'
          $pacmanDir = Join-Path $etcDir 'pacman.d'
          New-Item -ItemType Directory -Force -Path $pacmanDir | Out-Null
          Copy-Item (Join-Path $repoRoot 'pacman\pacman.conf') (Join-Path $etcDir 'pacman.conf') -Force
          Copy-Item (Join-Path $repoRoot 'pacman-mirrors\mirrorlist.msys') (Join-Path $pacmanDir 'mirrorlist.msys') -Force
          Copy-Item (Join-Path $repoRoot 'pacman-mirrors\mirrorlist.mingw') (Join-Path $pacmanDir 'mirrorlist.mingw') -Force

          $carch = switch ($env:PROCESSOR_ARCHITECTURE) {
            'ARM64' { 'aarch64' }
            'AMD64' { 'x86_64' }
            default { 'x86_64' }
          }
          $chost = switch ($carch) {
            'aarch64' { 'aarch64-pc-msys' }
            'x86_64' { 'x86_64-pc-msys' }
            default { "$carch-pc-msys" }
          }
          $makepkgConf = Get-Content (Join-Path $repoRoot 'pacman\makepkg.conf') -Raw
          $makepkgConf = $makepkgConf.Replace('@CARCH@', $carch).Replace('@CHOST@', $chost).Replace('@CARCHFLAGS@', '')
          Set-Content (Join-Path $etcDir 'makepkg.conf') -Value $makepkgConf -NoNewline

          $pacmanConf = Join-Path $etcDir 'pacman.conf'
          $contents = Get-Content $pacmanConf -Raw
          if ($contents -notmatch '^\[staging\]') {
            $contents = "[staging]`nServer = https://repo.msys2.org/staging/`nSigLevel = Never`n$contents"
          }
          Set-Content $pacmanConf -Value $contents -NoNewline

      - name: Update using staging
        shell: pwsh
        run: |
          $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
          $pacman = Join-Path $msys2Root 'usr\bin\pacman.exe'
          & $pacman --noconfirm -Suuy
          & $pacman --noconfirm -Suu
          & $pacman --noconfirm --needed -S git python base-devel

      - name: Download fork-local AArch64 MSYS inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'msysarm64-inputs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download msysarm64-runtime-pr10-a527-20260824 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-headers-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-devel-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-sysroot-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-windows-default-manifest-*.pkg.tar.zst' `
            --dir $destination
          gh release download msysarm64-gcc-pr13-20260826 `
            --repo crutkas/MSYS2-packages `
            --pattern 'mingw-w64-cross-msysarm64-gcc-*.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-gcc-libs-*.pkg.tar.zst' `
            --dir $destination

          $expected = @{
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '263f8f7e3614ac41337ce3a223f2bb26b6459aef6f34670525cdd4c03ec3ae21'
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'c18b51e483991770b8e06cc2d8f7002d06784d3071ac213a8fee24bb831267d1'
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'e30609e09eab2fa07aba2e6196b05f34e5e9107abc4ab8832966684758c743ca'
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '33861708e7f981b4eef5b93ef135ab3a43d2757533f64df6f61a146d823c355f'
            'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' = 'a74887c76a933ec424933bf662729d94975b83138af783bd93f2e7acd95c3a22'
            'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' = '990f163cacf9ffce1b58445be91fedc57f135cc26a88d7dba109806446b41438'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $destination $entry.Key
            if ((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
          }

      - name: Install fork-local AArch64 MSYS inputs
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system') }}
        shell: pwsh
        run: |
          $input_dir = Join-Path $env:RUNNER_TEMP 'msysarm64-inputs'
          $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
          $pacman = Join-Path $msys2Root 'usr\bin\pacman.exe'
          & $pacman --noconfirm -U `
            "$input_dir\mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst" `
            "$input_dir\mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst"

      - name: Verify fork-local AArch64 MSYS packages
        if: ${{ github.repository == 'crutkas/MSYS2-packages' && (github.ref_name == 'crutkas-package-aarch64-static-libgcc' || github.ref_name == 'crutkas-congenial-system' || github.head_ref == 'crutkas-package-aarch64-static-libgcc' || github.head_ref == 'crutkas-congenial-system') }}
        shell: pwsh
        run: |
                   $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
                   $bash = Join-Path $msys2Root 'usr\bin\bash.exe'
                   $script = 'set -e; pacman -Q mingw-w64-cross-msysarm64-headers mingw-w64-cross-msysarm64-runtime mingw-w64-cross-msysarm64-runtime-devel mingw-w64-cross-msysarm64-sysroot mingw-w64-cross-msysarm64-windows-default-manifest mingw-w64-cross-msysarm64-gcc mingw-w64-cross-msysarm64-gcc-libs; pacman -Dk'
                   & $bash --login -lc $script

      - name: Move Checkout
        run: |
          $path = "${{ steps.facts.outputs.drive }}\_"
          If (Test-Path "$path") { rm -r -fo "$path" }
          Move-Item -Path ".\temp" -Destination "$path"

      - name: CI-Build
        shell: pwsh
        run: |
          $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
          $toolBin = if ('${{ matrix.msystem }}' -eq 'CLANGARM64') {
            Join-Path $msys2Root 'opt\bin'
          } else {
            Join-Path $msys2Root 'mingw64\bin'
          }
          if ('${{ matrix.msystem }}' -eq 'CLANGARM64') {
            $env:CI_PACKAGE_ARCH = 'aarch64'
          }
          $env:MSYS2_PATH_TYPE = 'inherit'
          $env:PATH = $toolBin + ';' + (Join-Path $msys2Root 'usr\bin') + ';' + $env:PATH
          $env:GIT_EXEC_PATH = Join-Path $msys2Root 'usr\lib\git-core'
          $bash = Join-Path $msys2Root 'usr\bin\bash.exe'
          $buildRoot = '${{ steps.facts.outputs.drive }}\_'
          $buildRoot = & (Join-Path $msys2Root 'usr\bin\cygpath.exe') -u $buildRoot
          $script = "cd '$buildRoot' && ./.ci/ci-build.sh"
          & $bash --login -lc $script

      - name: "Upload binaries"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-packages
          path: ${{ steps.facts.outputs.drive }}/_/artifacts/*.pkg.tar.*

      - name: "Upload debug logs"
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-libstdcxx-debug
          path: ${{ steps.facts.outputs.drive }}/_/mingw-w64-cross-msysarm64-libstdcxx-headers/src/libstdcxx-headers-report/*

  package-grokker:
    if: ${{ !(github.repository == 'crutkas/MSYS2-packages' && github.head_ref == 'crutkas-package-aarch64-static-libgcc') }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: MSYS-packages
          path: artifacts
      - name: Grok packages
        uses: jeremyd2019/package-grokker/grok-artifacts@main
        if: steps.artifacts.outcome == 'success'
        with:
          repo: msys
          path: artifacts
