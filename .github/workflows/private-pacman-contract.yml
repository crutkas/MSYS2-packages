name: private-pacman-contract

# Diagnostic only. Admission requires protected default-branch governance.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Reject unsupported pull request heads
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if ($env:PR_HEAD_REPOSITORY -cne $env:GITHUB_REPOSITORY) {
            throw "Unsupported fork head: $env:PR_HEAD_REPOSITORY"
          }

      - name: Check out the exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the same-repository exact head
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'pull_request') {
            if ($env:PR_HEAD_REPOSITORY -cne $env:GITHUB_REPOSITORY) {
              throw "Refusing a non-local pull request head: $env:PR_HEAD_REPOSITORY"
            }
            $expected = $env:PR_HEAD_SHA
          } else {
            $expected = $env:GITHUB_SHA
          }

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $expected) {
            throw "Checked-out HEAD $actual does not match event head $expected."
          }

      - name: Run the source-only contract
        id: source-contract
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive `
            -File .ci\Test-PrivatePacman.ps1 `
            -ReportPath '${{ runner.temp }}\private-pacman-contract.json'

      - name: Validate diagnostic coverage accounting
        shell: pwsh
        env:
          REPORT_PATH: ${{ runner.temp }}\private-pacman-contract.json
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content -Raw -LiteralPath $env:REPORT_PATH | ConvertFrom-Json
          if ($report.Schema -cne 'private-pacman-contract-tests/v3' -or
             $report.EvidenceAuthority -cne 'self-reported-diagnostic-only' -or
             $report.AdmissionReady -ne $false) {
            throw 'The diagnostic report authority or schema is invalid.'
          }
          if ($report.Runtime.ProcessArchitecture -cne
                 $report.Runtime.OSArchitecture -or
              $report.RecorderBuild.Architecture -cne
                 $report.Runtime.ProcessArchitecture -or
              $report.RecorderBuild.BuildToolArchitecture -cne
                 $report.Runtime.ProcessArchitecture -or
              $report.RecorderBuild.SdkVersion -notmatch '^10\.' -or
              $report.RecorderAttestation.Schema -cne
                 'private-pacman-recorder-attestation/v1' -or
              $report.RecorderAttestation.ProcessArchitecture -cne
                 $report.Runtime.ProcessArchitecture -or
              $report.RecorderAttestation.OSArchitecture -cne
                 $report.Runtime.OSArchitecture) {
            throw 'The runner, builder, and recorder architectures are not self-consistent.'
          }

          $summary = $report.Summary
          if ([int64]$summary.Total -ne (
                 [int64]$summary.Passed +
                 [int64]$summary.Failed +
                 [int64]$summary.Skipped
             ) -or
             [int64]$summary.Total -ne @($report.Tests).Count -or
             [int64]$summary.Passed -ne [int64]$report.Passed -or
             [int64]$summary.Failed -ne [int64]$report.Failed -or
             [int64]$summary.Skipped -ne [int64]$report.Skipped -or
             [int64]$summary.Failed -ne 0) {
            throw 'Passed, failed, and skipped test accounting is inconsistent.'
          }
          foreach ($status in @('Passed', 'Failed', 'Skipped')) {
            $actual = @($report.Tests | Where-Object Status -CEQ $status).Count
            if ($actual -ne [int64]$summary.$status) {
             throw "Test records do not match the $status summary."
            }
          }

          foreach ($state in @(
             $report.CanonicalSharedState,
             $report.CanonicalTransactionState
          )) {
            if ($state.CoverageStatus -cnotin @(
               'Covered',
               'NotCovered',
               'CaptureFailed'
            )) {
             throw 'Literal-root coverage status is invalid.'
            }
            if ($state.CoverageStatus -ceq 'CaptureFailed') {
             throw 'Literal-root capture failed.'
            }
            if ($state.CoverageStatus -ceq 'Covered' -and (
                   [int64]$state.EntryCountBefore -lt 0 -or
                   [int64]$state.EntryCountBefore -ne
                       [int64]$state.EntryCountAfter -or
                   $state.ByteAndMetadataIdentical -ne $true
               )) {
             throw 'Covered literal-root snapshots are inconsistent.'
            }
            if ($state.CoverageStatus -ceq 'NotCovered' -and (
                   $state.ExistedBefore -ne $false -or
                   $state.ExistedAfter -ne $false -or
                   [int64]$state.EntryCountBefore -ne 0 -or
                   [int64]$state.EntryCountAfter -ne 0 -or
                   $null -ne $state.ByteAndMetadataIdentical
               )) {
             throw 'NotCovered literal-root evidence is misleading.'
            }
          }

          if ($summary.LiteralCoverageStatus -cne
             $report.CanonicalSharedState.CoverageStatus -or
             $summary.TransactionCoverageStatus -cne
             $report.CanonicalTransactionState.CoverageStatus) {
            throw 'Literal-root coverage summaries do not match their evidence.'
          }
          if ($report.CanonicalSharedState.Path -cne 'C:\msys64' -or
              $report.CanonicalTransactionState.Path -cne 'C:\msys64' -or
              $report.CanonicalTransactionState.CoverageStatus -cne 'Covered' -or
              [string]::IsNullOrWhiteSpace(
                 [string]$report.CanonicalTransactionState.FileSystemPath
              )) {
            throw 'The logical or physical canonical-root transaction boundary is invalid.'
          }
          $literalTests = [ordered]@{
            'literal C:\msys64 suite coverage is strict and countable' =
               $summary.LiteralCoverageStatus
            'literal C:\msys64 transaction coverage is countable' =
               $summary.TransactionCoverageStatus
          }
          foreach ($entry in $literalTests.GetEnumerator()) {
            $expectedStatus = if ($entry.Value -ceq 'Covered') {
             'Passed'
            } else {
             'Skipped'
            }
            $matching = @(
             $report.Tests |
                 Where-Object Name -CEQ $entry.Key |
                 Where-Object Status -CEQ $expectedStatus
            )
            if ($matching.Count -ne 1) {
             throw "Literal-root test accounting is invalid: $($entry.Key)"
            }
          }
          if ($report.PopulatedSharedState.Kind -cne
             'synthetic-populated-fixed-drive-root') {
            throw 'Synthetic populated-root evidence is not explicitly separated.'
          }

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-pacman-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-pacman-contract.json
          if-no-files-found: error
          retention-days: 7
