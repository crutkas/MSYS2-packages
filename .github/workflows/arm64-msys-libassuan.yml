name: Fork ARM64 MSYS libassuan

on:
  workflow_dispatch:
    inputs:
      fixed_binutils_run_id:
        description: Workflow run containing the reviewed fixed binutils candidate
        required: true
        type: string
      fixed_binutils_artifact:
        description: Artifact name containing the reviewed fixed binutils candidate
        required: true
        default: MSYS-packages
        type: string
      fixed_binutils_filename:
        description: Exact fixed binutils package filename
        required: true
        type: string
      fixed_binutils_sha256:
        description: Exact fixed binutils package SHA-256
        required: true
        type: string
      fixed_binutils_seal_filename:
        description: Exact fixed-binutils seal filename
        required: true
        type: string
      fixed_binutils_seal_sha256:
        description: Exact fixed-binutils seal SHA-256
        required: true
        type: string
      libgpg_error_run_id:
        description: Workflow run containing the sealed libgpg-error candidate
        required: true
        type: string
      libgpg_error_artifact:
        description: Artifact name containing the sealed libgpg-error candidate
        required: true
        default: MSYS-packages
        type: string
      libgpg_error_sha256:
        description: SHA-256 of the libgpg-error runtime candidate
        required: true
        type: string
      libgpg_error_devel_sha256:
        description: SHA-256 of the libgpg-error devel candidate
        required: true
        type: string
      libgpg_error_seal_filename:
        description: Exact libgpg-error lifecycle seal filename
        required: true
        type: string
      libgpg_error_seal_sha256:
        description: Exact libgpg-error lifecycle seal SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: ${{ github.repository == 'crutkas/MSYS2-packages' }}
    runs-on: windows-2025
    env:
      SOURCE_DATE_EPOCH: 1786817435

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: base base-devel autotools gcc pkgconf git
          update: true

      - name: Download and seal immutable inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_BINUTILS_RUN_ID: ${{ inputs.fixed_binutils_run_id }}
          FIXED_BINUTILS_ARTIFACT: ${{ inputs.fixed_binutils_artifact }}
          FIXED_BINUTILS_FILENAME: ${{ inputs.fixed_binutils_filename }}
          FIXED_BINUTILS_SHA256: ${{ inputs.fixed_binutils_sha256 }}
          FIXED_BINUTILS_SEAL_FILENAME: ${{ inputs.fixed_binutils_seal_filename }}
          FIXED_BINUTILS_SEAL_SHA256: ${{ inputs.fixed_binutils_seal_sha256 }}
          LIBGPG_ERROR_RUN_ID: ${{ inputs.libgpg_error_run_id }}
          LIBGPG_ERROR_ARTIFACT: ${{ inputs.libgpg_error_artifact }}
          LIBGPG_ERROR_SHA256: ${{ inputs.libgpg_error_sha256 }}
          LIBGPG_ERROR_DEVEL_SHA256: ${{ inputs.libgpg_error_devel_sha256 }}
          LIBGPG_ERROR_SEAL_FILENAME: ${{ inputs.libgpg_error_seal_filename }}
          LIBGPG_ERROR_SEAL_SHA256: ${{ inputs.libgpg_error_seal_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $inputsDir = Join-Path $env:RUNNER_TEMP 'libassuan-inputs'
          $fixedDir = Join-Path $inputsDir 'fixed-binutils'
          $gpgDir = Join-Path $inputsDir 'libgpg-error'
          New-Item -ItemType Directory -Force -Path $inputsDir, $fixedDir, $gpgDir | Out-Null

          gh run download $env:FIXED_BINUTILS_RUN_ID `
            --repo crutkas/MSYS2-packages `
            --name $env:FIXED_BINUTILS_ARTIFACT `
            --dir $fixedDir
          gh run download $env:LIBGPG_ERROR_RUN_ID `
            --repo crutkas/MSYS2-packages `
            --name $env:LIBGPG_ERROR_ARTIFACT `
            --dir $gpgDir

          gh release download msysarm64-runtime-pr10-a527-20260824 `
            --repo crutkas/MSYS2-packages `
            --dir $inputsDir `
            --pattern 'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst'
          gh release download msysarm64-gcc-pr13-20260826 `
            --repo crutkas/MSYS2-packages `
            --dir $inputsDir `
            --pattern 'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst'
          gh release download msysarm64-gcc-pr13-support-20260826 `
            --repo crutkas/MSYS2-packages `
            --dir $inputsDir `
            --pattern 'mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst'
          gh release download cygwinarm64-gcc-static-runtime-20260815 `
            --repo crutkas/MSYS2-packages `
            --dir $inputsDir `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' `
            --pattern 'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst'

          $fixed = Get-ChildItem -LiteralPath $fixedDir -Recurse -File |
            Where-Object Name -eq $env:FIXED_BINUTILS_FILENAME
          if ($fixed.Count -ne 1 -or
              $fixed.Name -notmatch '^mingw-w64-cross-cygwinarm64-binutils-[^-]+-[0-9]+-x86_64\.pkg\.tar\.zst$') {
            throw 'The fixed binutils handoff did not resolve to one expected package'
          }
          Copy-Item -LiteralPath $fixed.FullName -Destination (Join-Path $inputsDir $fixed.Name)
          $fixedSeal = Get-ChildItem -LiteralPath $fixedDir -Recurse -File |
            Where-Object Name -eq $env:FIXED_BINUTILS_SEAL_FILENAME
          if ($fixedSeal.Count -ne 1) {
            throw 'The fixed binutils handoff did not contain exactly one requested seal'
          }
          $fixedSealCopy = "fixed-binutils-$($fixedSeal.Name)"
          Copy-Item -LiteralPath $fixedSeal.FullName -Destination (Join-Path $inputsDir $fixedSealCopy)

          $gpgRuntimeName = 'mingw-w64-cross-msysarm64-libgpg-error-1.55-1-x86_64.pkg.tar.zst'
          $gpgDevelName = 'mingw-w64-cross-msysarm64-libgpg-error-devel-1.55-1-x86_64.pkg.tar.zst'
          foreach ($name in @($gpgRuntimeName, $gpgDevelName)) {
            $match = Get-ChildItem -LiteralPath $gpgDir -Recurse -File |
              Where-Object Name -eq $name
            if ($match.Count -ne 1) {
              throw "The libgpg-error handoff did not contain exactly one $name"
            }
            Copy-Item -LiteralPath $match.FullName -Destination (Join-Path $inputsDir $name)
          }
          $gpgSeal = Get-ChildItem -LiteralPath $gpgDir -Recurse -File |
            Where-Object Name -eq $env:LIBGPG_ERROR_SEAL_FILENAME
          if ($gpgSeal.Count -ne 1) {
            throw 'The libgpg-error handoff did not contain exactly one requested seal'
          }
          $gpgSealCopy = "libgpg-error-$($gpgSeal.Name)"
          Copy-Item -LiteralPath $gpgSeal.FullName -Destination (Join-Path $inputsDir $gpgSealCopy)

          $expected = [ordered]@{
            $env:FIXED_BINUTILS_FILENAME = $env:FIXED_BINUTILS_SHA256
            $fixedSealCopy = $env:FIXED_BINUTILS_SEAL_SHA256
            'mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '063579211851ed69370a6362f2795e39d9be0235a2bfe2f58da1bbd73a1d108e'
            'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst' = '17a8fbc22227c541ff3179179d307045302f6b18fbc6207cf9d863a9e4dad98c'
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '263f8f7e3614ac41337ce3a223f2bb26b6459aef6f34670525cdd4c03ec3ae21'
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '158c505f45025a466950faa7c85c9fd85e9d32384dd27b53586ffc75d71ca78e'
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'c18b51e483991770b8e06cc2d8f7002d06784d3071ac213a8fee24bb831267d1'
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = 'e30609e09eab2fa07aba2e6196b05f34e5e9107abc4ab8832966684758c743ca'
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst' = '33861708e7f981b4eef5b93ef135ab3a43d2757533f64df6f61a146d823c355f'
            'mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst' = '9715aab6894379bf5ab936a3a559f286fb4aedbb64f0774d7457182e00648e08'
            'mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst' = '7727936f4212e5af04e9739eca60f157c0875796c1e82fcfb79fd4398b111e24'
            'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst' = 'a74887c76a933ec424933bf662729d94975b83138af783bd93f2e7acd95c3a22'
            'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst' = '990f163cacf9ffce1b58445be91fedc57f135cc26a88d7dba109806446b41438'
            $gpgRuntimeName = $env:LIBGPG_ERROR_SHA256
            $gpgDevelName = $env:LIBGPG_ERROR_DEVEL_SHA256
            $gpgSealCopy = $env:LIBGPG_ERROR_SEAL_SHA256
          }
          $seal = foreach ($entry in $expected.GetEnumerator()) {
            $path = Join-Path $inputsDir $entry.Key
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value.ToLowerInvariant()) {
              throw "SHA-256 mismatch: $($entry.Key)"
            }
            [pscustomobject]@{
              filename = $entry.Key
              size = (Get-Item -LiteralPath $path).Length
              sha256 = $actual
            }
          }
          $seal | ConvertTo-Json |
            Set-Content -Encoding utf8 (Join-Path $inputsDir 'input-seal.json')

      - name: Create isolated build root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'libassuan-build-root'
          $db = Join-Path $root 'var\lib\pacman'
          $cache = Join-Path $root 'var\cache\pacman\pkg'
          $log = Join-Path $root 'var\log\pacman.log'
          New-Item -ItemType Directory -Force -Path $db, $cache, (Split-Path $log) | Out-Null
          & 'C:\msys64\usr\bin\pacman.exe' `
            --root $root `
            --dbpath $db `
            --cachedir $cache `
            --logfile $log `
            --gpgdir 'C:\msys64\etc\pacman.d\gnupg' `
            --noconfirm -Sy --needed base base-devel autotools gcc pkgconf
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to create isolated MSYS build root'
          }

          @'
          [options]
          Architecture = auto
          CheckSpace
          SigLevel = Never
          LocalFileSigLevel = Never
          '@ | Set-Content -Encoding ascii (Join-Path $root 'etc\pacman-local.conf')

      - name: Install sealed target inputs in isolated root
        shell: pwsh
        env:
          FIXED_BINUTILS_FILENAME: ${{ inputs.fixed_binutils_filename }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'libassuan-build-root'
          $inputsDir = Join-Path $env:RUNNER_TEMP 'libassuan-inputs'
          $pacman = Join-Path $root 'usr\bin\pacman.exe'
          $config = Join-Path $root 'etc\pacman-local.conf'
          function Install-Local([string[]]$Names, [string[]]$Assume = @()) {
            $arguments = @('--config', $config, '--noconfirm', '--needed')
            foreach ($virtual in $Assume) {
              $arguments += @('--assume-installed', $virtual)
            }
            $arguments += '-U'
            $arguments += $Names | ForEach-Object { Join-Path $inputsDir $_ }
            & $pacman @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Isolated package transaction failed: $($Names -join ', ')"
            }
          }

          Install-Local @(
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-w32api-runtime-14.0.0.r0.g9b3dd0125-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-gcc-libs-15.0.1dev-1-x86_64.pkg.tar.zst',
            $env:FIXED_BINUTILS_FILENAME,
            'mingw-w64-cross-cygwinarm64-gcc-libs-stage1-15.0.1dev-2-x86_64.pkg.tar.zst'
          )
          Install-Local @(
            'mingw-w64-cross-cygwinarm64-gcc-stage1-15.0.1dev-2-x86_64.pkg.tar.zst'
          ) @('mingw-w64-cross-cygwinarm64-libstdc++-headers=15.0.1dev-1')
          Install-Local @(
            'mingw-w64-cross-msysarm64-libstdc++-headers-15.0.1dev-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-gcc-15.0.1dev-1-x86_64.pkg.tar.zst'
          ) @('mingw-w64-cross-cygwinarm64-libstdc++-headers=15.0.1dev-1')
          Install-Local @(
            'mingw-w64-cross-msysarm64-libgpg-error-1.55-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-libgpg-error-devel-1.55-1-x86_64.pkg.tar.zst'
          )

          $bin = Join-Path $root 'opt\bin'
          foreach ($tool in @(
              'as', 'ld', 'ar', 'nm', 'objcopy', 'objdump', 'ranlib',
              'strip', 'windres', 'dlltool', 'readelf', 'size', 'addr2line', 'strings')) {
            $source = Join-Path $bin "aarch64-pc-cygwin-$tool.exe"
            $destination = Join-Path $bin "aarch64-pc-msys-$tool.exe"
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Fixed binutils is missing $source"
            }
            Copy-Item -Force -LiteralPath $source -Destination $destination
          }

      - name: Build and audit candidate packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'libassuan-build-root'
          $inputsDir = Join-Path $env:RUNNER_TEMP 'libassuan-inputs'
          $candidateDir = Join-Path $env:RUNNER_TEMP 'libassuan-candidate'
          $logDir = Join-Path $env:RUNNER_TEMP 'libassuan-logs'
          $transactionRoot = Join-Path $env:RUNNER_TEMP 'libassuan-transaction-root'
          $transactionReport = Join-Path $env:RUNNER_TEMP 'libassuan-transaction-report'
          New-Item -ItemType Directory -Force -Path $candidateDir, $logDir | Out-Null

          curl.exe -fsSL -o (Join-Path $inputsDir 'signature_key.asc') `
            https://gnupg.org/signature_key.asc
          $bash = Join-Path $root 'usr\bin\bash.exe'
          $repo = & $bash -lc "cygpath -u '$env:GITHUB_WORKSPACE'"
          $inputsPosix = & $bash -lc "cygpath -u '$inputsDir'"
          $candidatePosix = & $bash -lc "cygpath -u '$candidateDir'"
          $logsPosix = & $bash -lc "cygpath -u '$logDir'"
          $script = @"
          set -euo pipefail
          mkdir -p /home/runneradmin/.gnupg
          chmod 700 /home/runneradmin/.gnupg
          gpg --batch --import '$inputsPosix/signature_key.asc'
          cd '$repo/mingw-w64-cross-msysarm64-libassuan'
          export SRCDEST='$inputsPosix'
          export PKGDEST='$candidatePosix'
          export LOGDEST='$logsPosix'
          export MAKEFLAGS='-j2'
          makepkg --cleanbuild --force --noconfirm --log --check
          "@
          & $bash -lc $script
          if ($LASTEXITCODE -ne 0) {
            throw 'libassuan build or binary audit failed'
          }

          $runtimeInputs = @(
            'mingw-w64-cross-msysarm64-headers-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-windows-default-manifest-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-sysroot-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-runtime-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-runtime-devel-3.6.10.r0.ga527ace21-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-libgpg-error-1.55-1-x86_64.pkg.tar.zst',
            'mingw-w64-cross-msysarm64-libgpg-error-devel-1.55-1-x86_64.pkg.tar.zst'
          ) | ForEach-Object { Join-Path $inputsDir $_ }
          $candidates = Get-ChildItem -LiteralPath $candidateDir -File -Filter '*.pkg.tar.zst' |
            Select-Object -ExpandProperty FullName
          & "$env:GITHUB_WORKSPACE\mingw-w64-cross-msysarm64-libassuan\audit-package-transaction.ps1" `
            -Pacman 'C:\msys64\usr\bin\pacman.exe' `
            -Bsdtar (Join-Path $root 'usr\bin\bsdtar.exe') `
            -TransactionRoot $transactionRoot `
            -DependencyArchives $runtimeInputs `
            -CandidateArchives $candidates `
            -ReportDirectory $transactionReport

          $transactionPosix = & $bash -lc "cygpath -u '$transactionRoot'"
          $postPackageReport = Join-Path $env:RUNNER_TEMP 'libassuan-post-package-audit'
          $postPackageReportPosix = & $bash -lc "cygpath -u '$postPackageReport'"
          $postPackageAudit = @"
          set -euo pipefail
          '$repo/mingw-w64-cross-msysarm64-libassuan/audit-msysarm64.sh' \
            '$transactionPosix/opt/aarch64-pc-msys' \
            '$postPackageReportPosix' \
            '$repo/mingw-w64-cross-msysarm64-libassuan/context-smoke.c' \
            '$repo/mingw-w64-cross-msysarm64-libassuan/pipe-smoke.c' \
            '$transactionPosix/opt/aarch64-pc-msys' \
            '$repo/mingw-w64-cross-msysarm64-libassuan/src/libassuan-3.0.2/src/libassuan.vers'
          "@
          & $bash -lc $postPackageAudit
          if ($LASTEXITCODE -ne 0) {
            throw 'Post-package payload audit failed'
          }

          $smokeSource = Join-Path $postPackageReport 'smoke'
          $bundle = Join-Path $env:RUNNER_TEMP 'libassuan-native-smoke'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item -Path (Join-Path $smokeSource '*.exe') -Destination $bundle
          Copy-Item -LiteralPath (Join-Path $transactionRoot 'opt\aarch64-pc-msys\bin\msys-2.0.dll') `
            -Destination $bundle
          Copy-Item -Path (Join-Path $transactionRoot 'opt\aarch64-pc-msys\usr\bin\msys-*.dll') `
            -Destination $bundle

      - name: Upload sealed candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: msysarm64-libassuan-candidate
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/libassuan-candidate/*.pkg.tar.zst
            ${{ runner.temp }}/libassuan-inputs/input-seal.json
            ${{ runner.temp }}/libassuan-inputs/fixed-binutils/*
            ${{ runner.temp }}/libassuan-inputs/libgpg-error/*
            ${{ runner.temp }}/libassuan-logs/*
            ${{ runner.temp }}/libassuan-transaction-report/*
            ${{ runner.temp }}/libassuan-post-package-audit/*
            ${{ github.workspace }}/mingw-w64-cross-msysarm64-libassuan/src/audit-report/*

      - name: Upload deterministic native smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: msysarm64-libassuan-native-smoke
          if-no-files-found: error
          path: ${{ runner.temp }}/libassuan-native-smoke/*

  native-arm64-smoke:
    needs: build
    runs-on: windows-11-arm

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msysarm64-libassuan-native-smoke
          path: smoke

      - name: Run strict native ARM64 dynamic and static smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path -LiteralPath smoke).Path
          foreach ($required in @(
              'context-dynamic.exe',
              'context-static.exe',
              'pipe-dynamic.exe',
              'msys-2.0.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $required))) {
              throw "Native smoke bundle is missing $required"
            }
          }
          $env:PATH = "$bundle;$env:PATH"
          foreach ($program in @(
              'context-dynamic.exe',
              'context-static.exe',
              'pipe-dynamic.exe')) {
            & (Join-Path $bundle $program)
            if ($LASTEXITCODE -ne 0) {
              throw "$program failed with exit code $LASTEXITCODE"
            }
          }
